version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      node-runtime:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      web-runtime:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    # Bump all GitHub Actions in a single PR. Coupled actions such as
    # codeql-action/init + analyze + upload-sarif must move to the same
    # version together; a per-action PR bumps one and fails CI with a
    # version mismatch (see #126/#127, resolved by #130).
    groups:
      github-actions:
        patterns:
          - '*'

name: Release Desktop GUI

# Build the native desktop GUI app (webview-bun) for macOS and Windows and
# publish it as its own GitHub release. DvalinCode has two product lines: the
# CLI (release.yml, `v*` tags) and this desktop app (`gui-v*` tags). The
# desktop release never takes the "latest" slot, so `releases/latest` — which
# the one-line CLI installer resolves — keeps pointing at the CLI.
#
# Trigger: push a `gui-v*` tag (e.g. gui-v0.7.0), or run manually.
#   git tag gui-v0.7.0 && git push origin gui-v0.7.0
#
# Where each target is built:
#   - macOS runner: the macOS .app (sips/iconutil for the .icns, Developer ID
#     signing, notarization).
#   - Windows runner: the Windows .exe and its per-user installer. Bun accepts
#     --windows-icon/--windows-version only on a Windows host, and Inno Setup —
#     which compiles the installer — is a Windows program, so a cross-build from
#     macOS produced an .exe with no icon, no version metadata and no installer.
#     The same job then installs the app, starts it and uninstalls it
#     (scripts/smoke-gui-windows.ps1) before anything is published.
#
# The two jobs each write a SHA256SUMS-gui.txt over their own artifacts; the
# attest job concatenates them into the single file the release publishes and
# the macOS in-app updater fetches.

on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gui:
    runs-on: macos-latest
    permissions:
      contents: read

    # Optional Developer ID signing + notarization — same secrets as release.yml.
    # Without them the .app is ad-hoc signed (preview-grade). With them the app
    # is Developer-ID signed, notarized, and stapled (prompt-free download).
    env:
      DVALINCODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      # `secrets` can't be used in step `if:` — fold presence into env booleans.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_CREDS: ${{ secrets.APPLE_ID != '' }}

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install web frontend dependencies
        run: cd web && npm ci

      - name: Type-check and test
        run: npm run check

      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      # Import the Developer ID cert (skipped without the secret → ad-hoc).
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # Windows is built by its own job below; this one covers macOS.
      - name: Build desktop GUI artifacts (macOS)
        run: npm run build:gui:darwin

      # Notarize + staple the macOS .app, then repackage the archive so the
      # stapled ticket travels with it (offline-verifiable). Skipped without
      # Apple credentials. .app bundles (unlike bare binaries) can be stapled.
      - name: Notarize + staple desktop app
        if: env.HAS_NOTARY_CREDS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          shopt -s nullglob
          for tgz in release-gui/dvalincode-gui-v*-macos-*.tar.gz; do
            work="$RUNNER_TEMP/$(basename "$tgz" .tar.gz)"
            rm -rf "$work"; mkdir -p "$work"
            tar xzf "$tgz" -C "$work"
            app="$(find "$work" -maxdepth 3 -name '*.app' | head -1)"
            [ -n "$app" ] || { echo "  ! no .app in $tgz, skipping"; continue; }
            echo "▶ Notarizing $(basename "$app") from $tgz"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
            xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$app"
            ( cd "$work" && tar czf "$GITHUB_WORKSPACE/$tgz" ./* )
            rm -f "$RUNNER_TEMP/app.zip"
          done
          # Refresh checksums for the repackaged archives.
          ( cd release-gui && shasum -a 256 dvalincode-gui-v* > SHA256SUMS-gui.txt )

      - name: List artifacts
        run: ls -lh release-gui/

      - name: Upload artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dvalincode-gui-macos-${{ github.sha }}
          path: release-gui/*
          if-no-files-found: error

  build-gui-windows:
    name: Build Windows app + installer
    runs-on: windows-latest
    permissions:
      contents: read

    # scripts/build-gui.sh is bash; Git Bash runs it on the Windows runner.
    defaults:
      run:
        shell: bash

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install web frontend dependencies
        run: cd web && npm ci

      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      # The runner image ships Inno Setup 6; install it only if that changes,
      # rather than letting the build quietly skip the installer.
      - name: Ensure Inno Setup is available
        run: |
          if [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            # ISCC exits 1 after printing its help, which failed this step under
            # pipefail; keep only its banner line, for the log.
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /? 2>&1 | grep -m1 'Inno Setup' || true
          else
            echo "Inno Setup 6 not on the runner image — installing."
            choco install innosetup --no-progress -y
          fi

      # The type-check and the full test suite already ran on the macOS job,
      # which gates this one; repeating them here would only add runner time.
      - name: Build Windows desktop app + installer
        run: npm run build:gui:windows

      # Nothing else here has ever run the WebView2 window: install the app with
      # its setup executable, start it the way the Start menu entry does, check
      # that the window opens and the embedded server answers, then close and
      # uninstall it. A failure here stops the release.
      - name: Install, launch and uninstall the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem release-gui -Filter 'dvalincode-gui-v*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No setup executable in release-gui/.' }
          ./scripts/smoke-gui-windows.ps1 -Installer $setup.FullName -Screenshot "$env:RUNNER_TEMP\gui-windows-smoke.png"

      # What the window showed: a window can open and still paint nothing.
      - name: Upload the smoke-test screenshot
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gui-windows-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/gui-windows-smoke.png
          if-no-files-found: ignore

      # Both jobs name this file the same; keep them apart until the attest
      # job merges them.
      - name: Separate the Windows checksum file
        run: mv release-gui/SHA256SUMS-gui.txt release-gui/SHA256SUMS-gui-windows.txt

      - name: List artifacts
        run: ls -lh release-gui/

      - name: Upload artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dvalincode-gui-windows-${{ github.sha }}
          path: release-gui/*
          if-no-files-found: error

  attest-gui:
    name: Attest desktop artifacts
    needs: [build-gui, build-gui-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download macOS artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dvalincode-gui-macos-${{ github.sha }}
          path: release-gui

      - name: Download Windows artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dvalincode-gui-windows-${{ github.sha }}
          path: release-gui

      # One SHA256SUMS-gui.txt over every artifact: that is the name the
      # release publishes and the in-app updater fetches. Verify it here, so a
      # mismatch fails the release rather than a user's download.
      - name: Merge checksum files
        run: |
          cd release-gui
          cat SHA256SUMS-gui.txt SHA256SUMS-gui-windows.txt | sort -k2 > merged.txt
          mv merged.txt SHA256SUMS-gui.txt
          rm SHA256SUMS-gui-windows.txt
          sha256sum -c SHA256SUMS-gui.txt
          cat SHA256SUMS-gui.txt

      - name: Generate build provenance
        # actions/attest-build-provenance v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release-gui/SHA256SUMS-gui.txt

      - name: Upload merged release artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dvalincode-gui-${{ github.sha }}
          path: release-gui/*
          if-no-files-found: error

  publish-gui:
    name: Publish GitHub release
    needs: [build-gui, build-gui-windows, attest-gui]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dvalincode-gui-${{ github.sha }}
          path: release-gui

      - name: Publish GitHub release
        # softprops/action-gh-release v3.0.3
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          prerelease: false
          # Never take the "latest" slot: install.sh resolves the CLI bundle
          # from releases/latest, which must stay a v* (CLI) release.
          make_latest: "false"
          generate_release_notes: true
          name: "Desktop GUI ${{ github.ref_name }}"
          body: |
            Native desktop GUI build (webview-bun, OS-native webview).

            **Windows** — download `dvalincode-gui-v*-windows-x64-setup.exe`
            and run it. It installs per-user under
            `%LocalAppData%\Programs\DvalinCode` (no administrator, no UAC
            prompt), adds a Start menu entry and an uninstall entry, and
            installs the Microsoft Edge WebView2 Runtime if it is missing. The
            `.zip` is still there for anyone who would rather not install.
            The setup executable is not yet Authenticode signed, so SmartScreen
            warns on first run — choose *More info → Run anyway*.

            **macOS** — install DvalinCode.app into /Applications with
            `curl -fsSL https://raw.githubusercontent.com/arthurpanhku/dvalincode/main/scripts/install.sh | bash -s -- --gui`,
            or download the `.tar.gz` for your Mac and drag the app out of it.

            There is no Linux desktop app: on Linux, install the CLI and run
            `dvalincode serve` for the web UI.
          files: |
            release-gui/dvalincode-gui-v*
            release-gui/SHA256SUMS-gui.txt

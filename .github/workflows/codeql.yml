name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # github/codeql-action/init v4.38.0
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        # github/codeql-action/analyze v4.38.0
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: '/language:javascript-typescript'

name: Release (CLI + Web bundle)

# Build the stable CLI + Web bundle for all platforms (macOS arm64/x64,
# Linux arm64/x64, Windows x64) and attach the archives to a GitHub Release.
#
# Each archive is self-contained: CLI binary + web/dist/ + start launcher
# (no Node runtime needed). The bare binary is the terminal agent; `serve`
# (and the start.sh/start.bat launcher) starts the web GUI.
#
# The native desktop GUI app ships on a separate, experimental pre-release
# track — see .github/workflows/release-gui.yml.
#
# Pushing a version tag does everything: build, Evidence Pack, provenance,
# the GitHub Release, and the npm publish. There is no manual publish step —
# npm previously drifted from the tags because that step was done by hand.
#
# Recommended flow:
#   1. Bump the version in BOTH package.json and src/version.ts (they are
#      separate constants; the npm job refuses a tag that disagrees with
#      package.json).
#   2. Run manually (workflow_dispatch) → download + inspect the artifacts.
#      A manual run never publishes: every publishing job is tag-gated.
#   3. When satisfied, push the version tag:
#        git tag v0.7.0 && git push origin v0.7.0
#
# Requires the NPM_TOKEN repository secret (an npm Automation token).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_vscode_tag:
        description: 'Existing release tag whose VS Code extension should be rebuilt and published (for example v0.18.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    # macOS runner so `codesign` is available to sign the darwin binaries
    # (clears the Gatekeeper "damaged" error on Apple Silicon). Bun cross-compiles
    # the linux/windows targets from here too.
    runs-on: macos-latest
    permissions:
      contents: read

    # ── Optional Developer ID signing + notarization ─────────────────────────
    # Without the secrets below, the build falls back to ad-hoc signing (still
    # "damaged"-free locally, but a browser-downloaded copy shows "unidentified
    # developer"). Set these repo secrets to get fully notarized, prompt-free
    # downloads:
    #   MACOS_SIGN_IDENTITY      "Developer ID Application: NAME (TEAMID)"
    #   MACOS_CERTIFICATE_P12    base64 of the exported Developer ID .p12
    #   MACOS_CERTIFICATE_PASSWORD   password for that .p12
    #   APPLE_ID                 Apple ID email (for notarytool)
    #   APPLE_TEAM_ID            10-char Team ID
    #   APPLE_APP_PASSWORD       app-specific password for the Apple ID
    env:
      # Empty unless configured → build scripts fall back to ad-hoc signing.
      DVALINCODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      # `secrets` can't be used in step `if:` — fold presence into env booleans.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_CREDS: ${{ secrets.APPLE_ID != '' }}

    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install web frontend dependencies
        run: cd web && npm ci

      - name: Type-check and test
        run: npm run check

      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      # Import the Developer ID cert into a temp keychain so the build step can
      # sign with it. Skipped entirely when the secret is absent (→ ad-hoc).
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # build:release also runs the structure + checksum smoke test on every
      # archive and fails the job if any archive is malformed.
      - name: Build CLI + Web bundle (all platforms)
        run: npm run build:release

      - name: List artifacts
        run: ls -lh release/

      # Explicit artifact verification, independent of the build step.
      - name: Verify checksums
        run: cd release && shasum -a 256 -c SHA256SUMS.txt

      # Every release ships an Evidence Pack produced BY the shipped binary:
      # real governed runs (one allowed, one blocked by policy) on this build
      # machine, exported and re-verified offline. The script appends the pack's
      # checksum to SHA256SUMS.txt, so the provenance attestation below covers
      # it too. See docs/RELEASE-EVIDENCE.md.
      - name: Build release Evidence Pack
        run: |
          set -euo pipefail
          ARCH=x64
          if [ "$(uname -m)" = "arm64" ]; then ARCH=arm64; fi
          mkdir -p release/evidence-bin
          tar xzf release/dvalincode-v*-macos-"$ARCH".tar.gz -C release/evidence-bin
          BIN="$(find release/evidence-bin -maxdepth 2 -type f -name "dvalincode-macos-$ARCH" | head -1)"
          [ -n "$BIN" ] || { echo "evidence: shipped binary not found" >&2; exit 1; }
          node scripts/release-evidence.mjs --bin "$BIN"
          rm -rf release/evidence-bin
          # Re-verify including the appended Evidence Pack line.
          cd release && shasum -a 256 -c SHA256SUMS.txt

      # Notarize the macOS archives so Gatekeeper clears them on download.
      # Skipped without the Apple credentials (→ ad-hoc builds ship as-is).
      # NOTE: a bare CLI binary inside a .tar.gz cannot be stapled, so this
      # relies on Gatekeeper's online notarization check on first run. For
      # offline-stapled CLI distribution, ship a signed .dmg/.pkg instead.
      - name: Notarize macOS archives
        if: env.HAS_NOTARY_CREDS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for a in release/dvalincode-v*-macos-*.tar.gz; do
            echo "▶ Notarizing $a"
            xcrun notarytool submit "$a" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
          done

      # Always upload the archives so they can be downloaded and inspected
      # before a tag is pushed (manual run) and kept as a record (tag run).
      - name: Upload artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dvalincode-cli-${{ github.sha }}
          path: release/*
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download release artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dvalincode-cli-${{ github.sha }}
          path: release

      - name: Generate build provenance
        # actions/attest-build-provenance v4.1.1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release/SHA256SUMS.txt

  publish:
    name: Publish GitHub Release
    needs: [build, attest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dvalincode-cli-${{ github.sha }}
          path: release

      - name: Publish GitHub Release
        # softprops/action-gh-release v3.0.1
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
          files: |
            release/dvalincode-v*-macos-arm64.tar.gz
            release/dvalincode-v*-macos-x64.tar.gz
            release/dvalincode-v*-linux-arm64.tar.gz
            release/dvalincode-v*-linux-x64.tar.gz
            release/dvalincode-v*-windows-x64.zip
            release/dvalincode-v*-evidence.json
            release/SHA256SUMS.txt

  # npm has drifted from the git tags before: v0.14.1 was tagged and released on
  # GitHub but never published to npm, so `npx dvalincode` served a stale build
  # until someone noticed. This closes that gap by hand-off, not by discipline.
  npm:
    name: Publish to npm
    needs: [build, attest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance attestation
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v6.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a release. Fail loudly instead.
      - name: Check the tag matches package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ${pkg}."
            exit 1
          fi
          echo "version=${pkg}" >> "$GITHUB_OUTPUT"

      # Re-running a release (a moved tag, a retried job) must not turn into a
      # red build just because the version is already on the registry.
      - name: Skip when the version is already published
        id: published
        run: |
          if npm view "dvalincode@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dvalincode@${{ steps.version.outputs.version }} is already on npm — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.already == 'false'
        run: npm ci

      # `prepublishOnly` re-runs the build and the full check before anything
      # leaves the runner. --provenance ties the published tarball to this
      # workflow run, the same guarantee the release archives get from attest.
      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # A formula updated by hand drifts, the way npm did before it was automated.
  # Runs after the release exists, because it pins that release's own checksums.
  #
  # It opens a pull request rather than pushing: main requires status checks, so
  # a direct push from CI is rejected outright (GH006). A PR opened with
  # GITHUB_TOKEN does not start those checks either — close and reopen it once.
  homebrew:
    name: Update Homebrew formula
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Checks out main, not the tag: the formula change belongs on the branch.
      # persist-credentials stays on here — unlike every other job in this repo
      # — because this one has to push a branch.
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      # actions/setup-node v6.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Regenerate the formula
        run: node scripts/update-homebrew-formula.mjs --version "${GITHUB_REF_NAME#v}"

      - name: Open a pull request if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/dvalincode.rb; then
            echo "::notice::Formula already current for ${GITHUB_REF_NAME}."
            exit 0
          fi
          branch="chore/homebrew-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/dvalincode.rb
          git commit -m "chore(homebrew): pin formula to ${GITHUB_REF_NAME}"
          git push --force origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "::notice::Pull request for ${branch} is already open."
            exit 0
          fi
          printf '%s\n' \
            'Generated by `scripts/update-homebrew-formula.mjs` from this release'"'"'s own SHA256SUMS.' \
            '' \
            'Required checks do not start by themselves: GitHub does not trigger workflows' \
            'for a pull request opened with `GITHUB_TOKEN`. Close and reopen this PR once' \
            'to run them, then merge.' > pr-body.md
          gh pr create --base main --head "$branch" \
            --title "chore(homebrew): pin formula to ${GITHUB_REF_NAME}" \
            --body-file pr-body.md

  # Listing the MCP server is what makes it findable by agents at all. OIDC
  # rather than a token: the registry derives the namespace from this
  # repository's owner, so `io.github.arthurpanhku/*` needs no stored secret.
  #
  # Runs after npm, because the listing points at the published package.
  mcp-registry:
    name: Publish to the MCP registry
    needs: [npm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC authentication to the registry
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Three files carry the version independently. Fail loudly on a mismatch
      # rather than quietly listing a version nobody can install.
      # The registry validates server.json only after everything else in the
      # release has already shipped, so a rejection there is expensive to
      # discover. Check what it checks, first.
      - name: Validate server.json before anything ships
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          srvpkg="$(node -p "require('./server.json').packages[0].version")"
          for pair in "package.json:${pkg}" "server.json:${srv}" "server.json packages[0]:${srvpkg}"; do
            name="${pair%%:*}"; value="${pair##*:}"
            if [ "$value" != "$tag" ]; then
              echo "::error::${name} is ${value} but the tag is ${tag}."
              exit 1
            fi
          done
          # The registry caps description at 100 characters and returns a 422
          # after auth, after npm, after the GitHub Release.
          len="$(node -p "require('./server.json').description.length")"
          if [ "$len" -gt 100 ]; then
            echo "::error::server.json description is ${len} characters; the registry allows 100."
            exit 1
          fi
          # The registry rejects a package whose package.json does not carry
          # mcpName matching the listing — its proof that the npm package and
          # the listing are the same owner. It only says so after auth.
          mcp="$(node -p "require('./package.json').mcpName || ''")"
          name="$(node -p "require('./server.json').name")"
          if [ "$mcp" != "$name" ]; then
            echo "::error::package.json mcpName is '${mcp}' but server.json name is '${name}'."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # The extension was built to v0.15.0 and then sat unpublished, so nobody using
  # VS Code, Cursor, or Windsurf could find it. Publishing by hand is how it got
  # there; this closes that gap the same way the npm job does.
  #
  # Both registries are optional: the job skips cleanly when the token is not
  # configured, so a release never fails on a marketplace that is not set up
  # yet. Open VSX is the one that reaches Cursor, Windsurf, and VSCodium — they
  # cannot install from the Microsoft marketplace at all.
  vscode-extension:
    name: Publish the VS Code extension
    needs: [publish]
    # A manual repair may run after the main release exists. `always()` lets
    # this job proceed when the tag-gated npm job was intentionally skipped.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_vscode_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: editors/vscode
    env:
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_vscode_tag || github.ref_name }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v6.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      # The extension version tracks the CLI, so a given extension and CLI
      # always agree on what the scanner does. A mismatch would publish an
      # extension nobody can trace back to a release.
      - name: Check the tag matches the extension version
        id: version
        run: |
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match editors/vscode/package.json ${pkg}."
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${pkg}" >> "$GITHUB_OUTPUT"

      - name: Verify a manual repair matches the released extension source
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git diff --exit-code "${RELEASE_TAG}" -- \
            src tests .vscodeignore README.md CHANGELOG.md icon.png tsconfig.json vitest.config.ts

      - name: Install dependencies
        run: npm ci

      # Packaging from a build that was never checked would ship whatever
      # happened to compile.
      - name: Build and check
        run: npm run check && npm run build

      - name: Package
        run: npm run package

      # Re-running a release (a moved tag, a retried job) must not go red just
      # because the version is already on a marketplace.
      - name: Publish to the VS Code Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npx vsce show "arthurpanhku.dvalincode-vscode" --json 2>/dev/null \
            | node -e "
                let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                  try{ process.exit(JSON.parse(s).versions.some(v=>v.version===process.env.VERSION)?0:1); }
                  catch{ process.exit(1); }
                });"; then
            echo "::notice::dvalincode-vscode ${VERSION} is already on the VS Code Marketplace — skipping."
          else
            npm run publish:vsce
          fi

      - name: Publish to Open VSX
        if: env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://open-vsx.org/api/arthurpanhku/dvalincode-vscode/${VERSION}")"
          if [ "$code" = "200" ]; then
            echo "::notice::dvalincode-vscode ${VERSION} is already on Open VSX — skipping."
          else
            npm run publish:ovsx
          fi

      - name: Report what was skipped
        if: env.HAS_VSCE_PAT != 'true' || env.HAS_OVSX_PAT != 'true'
        run: |
          [ "${HAS_VSCE_PAT}" = "true" ] || echo "::warning::VSCE_PAT is not set — the VS Code Marketplace publish was skipped. See editors/vscode/PUBLISHING.md."
          [ "${HAS_OVSX_PAT}" = "true" ] || echo "::warning::OVSX_PAT is not set — the Open VSX publish was skipped. See editors/vscode/PUBLISHING.md."

      # A .vsix on the release means the extension is installable by hand even
      # when a marketplace publish was skipped or is still propagating.
      - name: Attach the .vsix to the release
        # softprops/action-gh-release v3.0.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: editors/vscode/dvalin-security-scan.vsix
